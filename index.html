<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>John Emmanuel Dipol</h1> 
    <!-- Header -->
     <header> 
        <nav>
            <ul>
                <li>
                    <a href="about">About</a>
                </li>
                <li>
                    <a href="services">Services</a>
                </li>
                <li>
                    <a href="#contact">Contact</a>
                </li>
            </ul>

        </nav>
     </header>

     <main>

        <section id="about">
             <h2>
                About me 
             </h2>
             <p class="about">
            
               a student of BSIS at Colegio de Sta Ana de Victorias            
             </p>
        </section>
        <section id="services">
            <h2>
                My Services
            </h2>
            <p>
                At your Service
        </section>
        <section id="Contact">
            <h2>
                Contact Me
            </h2>
            <p>
                091234567890
            </p>
            <form action="#">
                 <!-- Name -->
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required> <br>

            <!-- Email-->
             <label for="email">Email</label>
             <input type="email" id="email" name="email" required> <br>


             <!-- Message -->
              <label for="message">Message</label>
              <textarea name="message" id="message" name="message" rows="1" required></textarea> <br>

              <label for="allow">Im Not a Robot</label>
              <input type="checkbox" name="allowed" id="allow">
              <button type="submit">Send Message</button> <br>
            </form>
           

        </section>
     </main>
</body>
</html>
